services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: equipment
      POSTGRES_USER: monitor
    ports:
      - "5432:5432"
    volumes:
      - ts_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ts_data:
