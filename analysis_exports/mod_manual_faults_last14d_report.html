<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOD Manual Stations - Top Faults (Last 14 Days)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --line: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1224 0%, var(--bg) 100%);
      color: var(--text);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { color: var(--muted); margin-bottom: 18px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(180px, 1fr)); margin-bottom: 18px; }
    .card { background: rgba(17,24,39,.9); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .card .v { font-size: 24px; margin-top: 6px; color: var(--accent); }
    .panel { background: rgba(17,24,39,.9); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .panel h2 { margin: 0 0 10px; font-size: 18px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    input, select, button {
      background: #0b1220;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      position: sticky; top: 0;
      background: #0b1220;
      border-bottom: 1px solid #334155;
      text-align: left;
      padding: 9px 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    tbody td { border-bottom: 1px solid #1f2937; padding: 8px; vertical-align: top; }
    tbody tr:hover { background: rgba(34,211,238,.06); }
    .table-wrap { max-height: 480px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
    .muted { color: var(--muted); font-size: 12px; }
    .right { text-align: right; white-space: nowrap; }
  </style>
</head>

function asNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function toCsv(rows, cols) {
  const esc = (x) => `"${String(x ?? '').replaceAll('"','""')}"`;
  const lines = [cols.map(c => esc(c.label)).join(',')];
  for (const r of rows) lines.push(cols.map(c => esc(r[c.key])).join(','));
  return lines.join('\n');
}

function download(name, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function renderTable(el, rows, cols, sorter) {
  const thead = `<thead><tr>${cols.map((c,i)=>`<th data-i="${i}">${c.label}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.right?'right':''}">${r[c.key] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>`;
  el.innerHTML = thead + tbody;
  el.querySelectorAll('th').forEach(th => th.addEventListener('click', () => sorter.set(Number(th.dataset.i))));
}

function makeSorter(cols, redraw) {
  let idx = 0;
  let asc = false;
  return {
    set(i) { if (idx === i) asc = !asc; else { idx = i; asc = true; } redraw(); },
    sort(rows) {
      const key = cols[idx].key;
      const num = cols[idx].numeric;
      const out = [...rows].sort((a,b) => {
        const av = a[key] ?? '';
        const bv = b[key] ?? '';
        if (num) return asNumber(av) - asNumber(bv);
        return String(av).localeCompare(String(bv));
      });
      return asc ? out : out.reverse();
    }
  };
}

const paretoCols = [
  { key:'fault_reason', label:'Fault Reason' },
  { key:'fault_count', label:'Fault Count', numeric:true, right:true },
  { key:'total_downtime_min', label:'Total Downtime (min)', numeric:true, right:true },
  { key:'avg_fault_s', label:'Avg Fault (s)', numeric:true, right:true },
  { key:'stations_hit', label:'Stations Hit', numeric:true, right:true },
];
let paretoFiltered = [...paretoData];
const paretoTable = document.getElementById('paretoTable');
const paretoMeta = document.getElementById('paretoMeta');
const paretoSort = makeSorter(paretoCols, drawPareto);

function drawPareto() {
  const q = document.getElementById('paretoSearch').value.toLowerCase().trim();
  paretoFiltered = paretoData.filter(r => !q || String(r.fault_reason).toLowerCase().includes(q));
  const view = paretoSort.sort(paretoFiltered);
  renderTable(paretoTable, view, paretoCols, paretoSort);
  paretoMeta.textContent = `${view.length} row(s)`;
}

document.getElementById('paretoSearch').addEventListener('input', drawPareto);
document.getElementById('paretoExport').addEventListener('click', () => {
  const view = paretoSort.sort(paretoFiltered);
  download('mod_manual_fault_pareto_visible.csv', toCsv(view, paretoCols));
});

const stationCols = [
  { key:'plc_name', label:'PLC' },
  { key:'station', label:'Station' },
  { key:'display_name', label:'Display Name' },
  { key:'rank_in_station', label:'Rank', numeric:true, right:true },
  { key:'fault_reason', label:'Fault Reason' },
  { key:'fault_count', label:'Fault Count', numeric:true, right:true },
  { key:'total_downtime_min', label:'Total Downtime (min)', numeric:true, right:true },
];
let stationFiltered = [...stationData];
const stationTable = document.getElementById('stationTable');
const stationMeta = document.getElementById('stationMeta');
const stationSort = makeSorter(stationCols, drawStations);

function drawStations() {
  const plc = document.getElementById('plcFilter').value;
  const st = document.getElementById('stationFilter').value;
  const q = document.getElementById('stationSearch').value.toLowerCase().trim();
  stationFiltered = stationData.filter(r =>
    (!plc || r.plc_name === plc) &&
    (!st || r.station === st) &&
    (!q || (`${r.display_name} ${r.fault_reason}`).toLowerCase().includes(q))
  );
  const view = stationSort.sort(stationFiltered);
  renderTable(stationTable, view, stationCols, stationSort);
  stationMeta.textContent = `${view.length} row(s)`;
}

['plcFilter','stationFilter'].forEach(id => document.getElementById(id).addEventListener('change', drawStations));
document.getElementById('stationSearch').addEventListener('input', drawStations);
document.getElementById('stationExport').addEventListener('click', () => {
  const view = stationSort.sort(stationFiltered);
  download('mod_manual_station_faults_visible.csv', toCsv(view, stationCols));
});

drawPareto();
drawStations();
