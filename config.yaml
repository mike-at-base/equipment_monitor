plcs:
  - name: CELL1
    opc_endpoint: "opc.tcp://10.200.2.134:4840"
    enabled: true
    equipment_modules:

      # ── ST10000  Cell Pallet Unload ──────────────────────────────────────
      - station: ST10000
        display_name: "Cell Pallet Unload"
        em_db_path: "ST10000_Station_DB.mainEquipmentModule"
        em_label: main
        enabled: true
        sequences:
          - { index: 1, name: Home, is_production: false }
          - { index: 2, name: Run,  is_production: true  }

      - station: ST10000
        display_name: "Pallet Unload Robot"
        em_db_path: "ST10000_RB01_DB.robotEquipmentModule"
        em_label: RB01
        enabled: true
        sequences:
          - { index: 1, name: Home,        is_production: false }
          - { index: 2, name: Maintenance, is_production: false }
          - { index: 3, name: Run,         is_production: true  }

      # ── ST31000  Cell Load 1 ─────────────────────────────────────────────
      - station: ST31000
        display_name: "Cell Load 1"
        em_db_path: "ST31000_Station_DB.mainEquipmentModule"
        em_label: main
        enabled: true
        sequences:
          - { index: 1, name: Home, is_production: false }
          - { index: 2, name: Run,  is_production: true  }

      - station: ST31000
        display_name: "Cell Load 1 Robot"
